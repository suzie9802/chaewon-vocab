  <title>채원이의 영어 단어장</title>
  <style>
    :root {
      --bg: #F8F6F2;
      --surface: #FFFFFF;
      --primary: #FF7A59;
      --primary-grad: linear-gradient(135deg, #FF7A59 0%, #FF9F68 100%);
      --blue: #3B82F6;
      --blue-soft: #EFF6FF;
      --green: #16A34A;
      --green-soft: #DCFCE7;
      --yellow: #F59E0B;
      --yellow-soft: #FEF3C7;
      --purple: #8B5CF6;
      --purple-soft: #F3E8FF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #EAE4DC;
      --shadow: 0 6px 20px rgba(31, 41, 55, 0.06);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: #ECE7DF;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    }
    .app-shell {
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      padding-bottom: calc(78px + var(--safe-bottom));
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* Top App Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(248, 246, 242, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .streak-pill {
      background: var(--yellow-soft);
      color: #B45309;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .add-icon-btn {
      border: none;
      background: var(--primary);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      padding: 16px 16px 20px;
    }
    /* Dashboard */
    .hero-card {
      background: var(--primary-grad);
      color: #fff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(255, 122, 89, 0.28);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .hero-sub { font-size: 12.5px; font-weight: 700; opacity: 0.92; }
    .hero-title { font-size: 21px; font-weight: 900; margin: 4px 0 8px; line-height: 1.25; }
    .hero-btn {
      border: none;
      background: #fff;
      color: #E85D3F;
      font-weight: 900;
      font-size: 13.5px;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .ring-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      flex-shrink: 0;
    }
    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .ring-text span { font-size: 10px; opacity: 0.88; font-weight: 700; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-num { font-size: 22px; font-weight: 900; color: var(--text); }
    .stat-lbl { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 3px; }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 2px 10px;
    }
    .sec-head h3 { margin: 0; font-size: 15.5px; font-weight: 900; }
    .sec-link {
      border: none;
      background: none;
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      padding: 0;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .qa-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .qa-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .qa-title { font-size: 14.5px; font-weight: 800; color: var(--text); }
    .qa-desc { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 600; }
    .recent-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .mini-word-card {
      min-width: 128px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      flex-shrink: 0;
    }
    .mini-word-card img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }
    .mini-word-name { font-size: 15px; font-weight: 900; margin-top: 6px; }
    .mini-word-ko { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Filter & Search */
    .search-box {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    .pill-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .pill {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    /* Word Card */
    .word-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .word-card.mastered { border-color: #86EFAC; }
    .img-box {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 6px;
      position: relative;
    }
    .img-box img {
      width: 190px;
      height: 190px;
      object-fit: contain;
    }
    .date-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: #F3EFEA;
      padding: 4px 9px;
      border-radius: 999px;
    }
    .star-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      border: none;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      background: var(--yellow-soft);
      color: #92400E;
    }
    .star-pill.done { background: var(--green-soft); color: #166534; }
    .card-body { padding: 6px 16px 16px; }
    .word-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .word-title { font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -0.4px; }
    .phonetic { font-size: 13px; color: var(--muted); font-weight: 600; }
    .speak-btn {
      border: none;
      background: var(--blue-soft);
      color: #1D4ED8;
      font-weight: 800;
      font-size: 13px;
      padding: 9px 13px;
      border-radius: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .section-box { border-radius: 14px; padding: 11px 13px; margin-top: 9px; }
    .box-en { background: #F5F9FF; }
    .box-ko { background: #FFF7ED; }
    .box-ex { background: #F0FDF4; }
    .sec-label {
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .box-en .sec-label { color: #1D4ED8; }
    .box-ko .sec-label { color: #C2410C; }
    .box-ex .sec-label { color: #15803D; }
    .sec-text { font-size: 14.5px; line-height: 1.48; white-space: pre-line; font-weight: 600; }
    .ex-item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(21, 128, 61, 0.2); }
    .ex-item:first-of-type { margin-top: 3px; padding-top: 0; border-top: none; }
    .ex-en { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
    .ex-ko { font-size: 13px; color: #4B5563; margin-top: 2px; font-weight: 500; }
    .mini-play {
      border: none;
      background: #DCFCE7;
      color: #166534;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Flashcard Study Mode */
    .study-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      gap: 10px;
    }
    .study-btn {
      flex: 1;
      border: 1.5px solid var(--border);
      background: var(--surface);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Quiz */
    .quiz-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .quiz-img { width: 180px; height: 180px; object-fit: contain; margin: 10px auto; display: block; }
    .quiz-options { display: grid; gap: 10px; margin-top: 14px; }
    .quiz-opt {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }
    .quiz-opt.correct { background: var(--green-soft); border-color: var(--green); color: #166534; }
    .quiz-opt.wrong { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }

    /* History & Settings */
    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .timeline-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #F3EFEA;
      font-size: 13.5px;
    }
    .timeline-row:last-child { border-bottom: none; }
    .btn-outline {
      width: 100%;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + var(--safe-bottom));
      z-index: 30;
    }
    .nav-btn {
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }
    .nav-btn .ico { font-size: 20px; line-height: 1; }
    .nav-btn.active { color: var(--primary); }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(24px + var(--safe-bottom));
      max-height: 88dvh;
      overflow-y: auto;
    }
    .modal h3 { margin: 0 0 12px; font-size: 18px; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
    .field input, .field textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14.5px;
      font-family: inherit;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn-primary {
      flex: 1; background: var(--primary); color: #fff; border: none;
      border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn-ghost {
      background: #F3EFEA; color: var(--text); border: none;
      border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-title">🐣 채원이 영어단어장</div>
      <div class="topbar-actions">
        <div class="streak-pill" id="streakPill">🔥 1일차</div>
        <button class="add-icon-btn" id="openAddBtn" title="새 단어 추가">+</button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home"><span class="ico">🏠</span><span>홈</span></button>
      <button class="nav-btn" data-nav="words"><span class="ico">📖</span><span>단어장</span></button>
      <button class="nav-btn" data-nav="quiz"><span class="ico">🎯</span><span>퀴즈</span></button>
      <button class="nav-btn" data-nav="history"><span class="ico">📊</span><span>기록</span></button>
    </nav>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>새 영어 단어 추가하기</h3>
      <div class="field">
        <label>영어 단어 *</label>
        <input id="inWord" placeholder="예: puddle" />
      </div>
      <div class="field">
        <label>영영 뜻 (쉬운 영어 설명)</label>
        <textarea id="inEn" rows="2" placeholder="예: A small pool of water on the ground after rain."></textarea>
      </div>
      <div class="field">
        <label>영한 뜻 *</label>
        <input id="inKo" placeholder="예: 물웅덩이" />
      </div>
      <div class="field">
        <label>예문 (영어)</label>
        <input id="inExEn" placeholder="예: Don't jump in the muddy puddle!" />
      </div>
      <div class="field">
        <label>예문 뜻 (한글)</label>
        <input id="inExKo" placeholder="예: 진흙 물웅덩이에 뛰어들지 마!" />
      </div>
      <div class="btn-row">
        <button class="btn-ghost" id="closeModalBtn">취소</button>
        <button class="btn-primary" id="saveWordBtn">단어장에 저장</button>
      </div>
    </div>
  </div>

    const STORAGE_KEY = "chaewon_vocab_v1";
    const META_KEY = "chaewon_vocab_meta_v1";

    let activeNav = "home";
    let wordsFilter = "all";
    let searchQuery = "";
    let studyMode = false;
    let studyIndex = 0;
    let quizIndex = 0;
    let quizScore = 0;

    function loadWords() {
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { saved = []; }
      const byId = new Map();
      for (const s of saved) byId.set(s.id, s);
      for (const seed of SEED_WORDS) {
        const prev = byId.get(seed.id);
        byId.set(seed.id, { ...seed, mastered: prev ? !!prev.mastered : !!seed.mastered });
      }
      const merged = Array.from(byId.values());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
      return merged;
    }

    function updateStreak() {
      const today = new Date().toISOString().slice(0, 10);
      let meta = { days: [today], quizBest: 0 };
      try {
        const raw = JSON.parse(localStorage.getItem(META_KEY) || "null");
        if (raw && Array.isArray(raw.days)) meta = raw;
      } catch (e) {}
      if (!meta.days.includes(today)) meta.days.push(today);
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      return meta;
    }

    let words = loadWords();
    let meta = updateStreak();

    function saveWords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }

    function switchNav(nav) {
      activeNav = nav;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.nav === nav));
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function toggleMastered(id) {
      words = words.map(w => w.id === id ? { ...w, mastered: !w.mastered } : w);
      saveWords();
      render();
    }

    function renderHome() {
      const total = words.length;
      const done = words.filter(w => w.mastered).length;
      const left = total - done;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const r = 32;
      const c = 2 * Math.PI * r;
      const dash = c - (pct / 100) * c;

      return `
        <section class="hero-card">
          <div>
            <div class="hero-sub">채원이의 영어 성장 대시보드</div>
            <div class="hero-title">${left === 0 ? "모든 단어를 다 외웠어요! 🎉" : `오늘 배울 단어가 ${left}개 있어요!`}</div>
            <button class="hero-btn" onclick="studyMode=true; studyIndex=0; switchNav('words')">
              ▶ 오늘의 카드 학습 시작
            </button>
          </div>
          <div class="ring-wrap">
            <svg width="78" height="78" viewBox="0 0 78 78">
              <circle cx="39" cy="39" r="${r}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="7"/>
              <circle cx="39" cy="39" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="7"
                stroke-dasharray="${c}" stroke-dashoffset="${dash}" stroke-linecap="round"
                transform="rotate(-90 39 39)"/>
            </svg>
            <div class="ring-text">${pct}%<span>달성</span></div>
          </div>
        </section>

        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-num">${total}</div>
            <div class="stat-lbl">누적 단어</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" style="color:var(--green);">${done}</div>
            <div class="stat-lbl">외운 단어 ⭐</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" style="color:var(--primary);">${left}</div>
            <div class="stat-lbl">복습 필요 🌱</div>
          </div>
        </div>

        <div class="sec-head">
          <h3>빠른 실행</h3>
        </div>
        <div class="quick-actions">
          <button class="qa-card" onclick="studyMode=false; wordsFilter='learning'; switchNav('words')">
            <div class="qa-icon" style="background:var(--yellow-soft);">🌱</div>
            <div class="qa-title">헷갈리는 단어</div>
            <div class="qa-desc">${left}개 집중 복습하기</div>
          </button>
          <button class="qa-card" onclick="switchNav('quiz')">
            <div class="qa-icon" style="background:var(--purple-soft);">🎯</div>
            <div class="qa-title">그림 퀴즈</div>
            <div class="qa-desc">사진 보고 단어 맞추기</div>
          </button>
          <button class="qa-card" onclick="studyMode=false; wordsFilter='all'; switchNav('words')">
            <div class="qa-icon" style="background:var(--blue-soft);">📖</div>
            <div class="qa-title">전체 단어장</div>
            <div class="qa-desc">영영·영한 뜻과 예문</div>
          </button>
          <button class="qa-card" onclick="document.getElementById('modalBg').classList.add('open')">
            <div class="qa-icon" style="background:var(--green-soft);">➕</div>
            <div class="qa-title">새 단어 추가</div>
            <div class="qa-desc">모르는 단어 바로 저장</div>
          </button>
        </div>

        <div class="sec-head">
          <h3>최근 추가된 단어</h3>
          <button class="sec-link" onclick="studyMode=false; wordsFilter='all'; switchNav('words')">전체 보기 →</button>
        </div>
        <div class="recent-scroll">
          ${words.slice(0, 8).map((w, i) => `
            <div class="mini-word-card" onclick="studyMode=true; studyIndex=${i}; switchNav('words')">
              ${w.image ? `<img src="${w.image}" alt="${w.word}" />` : `<div style="font-size:44px;padding:12px 0;">📖</div>`}
              <div class="mini-word-name">${w.word}</div>
              <div class="mini-word-ko">${w.koMeaning.split("\n")[0]}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function wordCardHtml(w) {
      return `
        <article class="word-card ${w.mastered ? "mastered" : ""}">
          <div class="img-box">
            <span class="date-tag">${w.addedAt || "오늘"} · ${w.partOfSpeech || "단어"}</span>
            <button class="star-pill ${w.mastered ? "done" : ""}" onclick="toggleMastered('${w.id}')">
              ${w.mastered ? "⭐ 외웠어요!" : "🌱 외우는 중"}
            </button>
            ${w.image ? `<img src="${w.image}" alt="${w.word}" />` : `<div style="font-size:76px;padding:36px 0;">📖</div>`}
          </div>
          <div class="card-body">
            <div class="word-header">
              <div>
                <h2 class="word-title">${w.word}</h2>
                <div class="phonetic">${w.phonetic || ""}</div>
              </div>
              <button class="speak-btn" onclick="speak('${w.word.replace(/'/g, "\\'")}')">🔊 발음 듣기</button>
            </div>
            ${w.enMeaning ? `
              <div class="section-box box-en">
                <div class="sec-label">
                  <span>💡 영영 뜻 (쉬운 영어 설명)</span>
                  <button class="mini-play" onclick="speak('${w.enMeaning.replace(/'/g, "\\'")}')">🔊 듣기</button>
                </div>
                <div class="sec-text">${w.enMeaning}</div>
              </div>` : ""}
            <div class="section-box box-ko">
              <div class="sec-label"><span>🇰🇷 영한 뜻</span></div>
              <div class="sec-text">${w.koMeaning}</div>
            </div>
            ${(w.examples && w.examples.length) ? `
              <div class="section-box box-ex">
                <div class="sec-label"><span>💬 7살 맞춤 예문</span></div>
                ${w.examples.map(ex => `
                  <div class="ex-item">
                    <div class="ex-en">
                      <span>${ex.en}</span>
                      <button class="mini-play" onclick="speak('${ex.en.replace(/'/g, "\\'").replace(/"/g, "")}')">🔊</button>
                    </div>
                    <div class="ex-ko">${ex.ko}</div>
                  </div>
                `).join("")}
              </div>` : ""}
          </div>
        </article>
      `;
    }

    function renderWords() {
      let list = words;
      if (wordsFilter === "learning") list = list.filter(w => !w.mastered);
      if (wordsFilter === "mastered") list = list.filter(w => w.mastered);
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        list = list.filter(w => w.word.toLowerCase().includes(q) || w.koMeaning.toLowerCase().includes(q));
      }

      const controls = `
        <input class="search-box" id="searchInput" value="${searchQuery}" placeholder="🔍 단어 또는 뜻 검색..." />
        <div class="pill-row">
          <button class="pill ${!studyMode && wordsFilter==='all' ? 'active' : ''}" onclick="studyMode=false; wordsFilter='all'; render()">전체 (${words.length})</button>
          <button class="pill ${!studyMode && wordsFilter==='learning' ? 'active' : ''}" onclick="studyMode=false; wordsFilter='learning'; render()">헷갈려요 🌱</button>
          <button class="pill ${!studyMode && wordsFilter==='mastered' ? 'active' : ''}" onclick="studyMode=false; wordsFilter='mastered'; render()">외웠어요 ⭐</button>
          <button class="pill ${studyMode ? 'active' : ''}" onclick="studyMode=!studyMode; studyIndex=0; render()">한 장씩 학습</button>
        </div>
      `;

      if (!words.length) return controls + `<div class="empty">단어가 아직 없어요!</div>`;

      if (studyMode) {
        const safeIdx = ((studyIndex % words.length) + words.length) % words.length;
        const w = words[safeIdx];
        return controls + `
          <div style="text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px;">
            카드 ${safeIdx + 1} / ${words.length}
          </div>
          ${wordCardHtml(w)}
          <div class="study-nav">
            <button class="study-btn" onclick="studyIndex--; render()">← 이전 단어</button>
            <button class="study-btn" style="background:var(--primary);color:#fff;border-color:var(--primary);" onclick="studyIndex++; render()">다음 단어 →</button>
          </div>
        `;
      }

      if (!list.length) return controls + `<div class="empty">해당하는 단어가 없어요! 🌱</div>`;
      return controls + list.map(wordCardHtml).join("");
    }

    function maskWordInSentence(sentence, word) {
      if (!sentence || !word) return "";
      const re = new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(s|es|ed|ing)?\\b`, "gi");
      return sentence.replace(re, "______");
    }

    function renderQuiz() {
      if (words.length < 2) return `<div class="empty">퀴즈를 하려면 단어가 2개 이상 필요해요!</div>`;
      const target = words[quizIndex % words.length];
      const others = words.filter(w => w.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 2);
      const options = [target, ...others].sort(() => Math.random() - 0.5);
      const exList = target.examples && target.examples.length ? target.examples : [];
      const exObj = exList.length ? exList[quizIndex % exList.length] : null;
      const blankSentence = exObj ? maskWordInSentence(exObj.en, target.word) : "";

      return `
        <div class="quiz-card">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px;">
            <span>Quiz ${(quizIndex % words.length) + 1} / ${words.length}</span>
            <span style="color:var(--primary);">Score: ${quizScore} 🌟</span>
          </div>
          <div style="font-size:15px;font-weight:900;color:var(--text);">Read the clue and fill in the blank!</div>
          ${blankSentence ? `
            <div style="background:#F0FDF4;border-radius:16px;padding:13px 14px;margin:8px 0;text-align:left;">
              <div style="font-size:11.5px;font-weight:800;color:#15803D;margin-bottom:4px;">💬 Context Sentence</div>
              <div id="quizSentence" style="font-size:16px;font-weight:800;color:var(--text);line-height:1.45;">${blankSentence}</div>
            </div>` : ""}
          ${target.enMeaning ? `
            <div style="background:#F5F9FF;border-radius:16px;padding:12px 14px;margin:8px 0;text-align:left;">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;color:#1D4ED8;margin-bottom:4px;">
                <span>💡 English Clue</span>
                <button class="mini-play" style="background:#DBEAFE;color:#1E40AF;" onclick="speak('${target.enMeaning.replace(/'/g, "\\'")}')">🔊 Listen</button>
              </div>
              <div style="font-size:14px;font-weight:600;color:#1E3A8A;line-height:1.45;">${target.enMeaning}</div>
            </div>` : ""}
          <div class="quiz-options">
            ${options.map(o => `
              <button class="quiz-opt" onclick="checkQuiz(this, '${o.id}', '${target.id}')">${o.word}</button>
            `).join("")}
          </div>
          <div id="quizMsg" style="margin-top:14px;font-weight:900;font-size:16px;min-height:24px;"></div>
        </div>
      `;
    }

    function checkQuiz(btn, pickedId, answerId) {
      const msg = document.getElementById("quizMsg");
      if (pickedId === answerId) {
        btn.classList.add("correct");
        quizScore++;
        const w = words.find(x => x.id === answerId);
        const sentEl = document.getElementById("quizSentence");
        const exList = w.examples && w.examples.length ? w.examples : [];
        const exObj = exList.length ? exList[quizIndex % exList.length] : null;
        if (sentEl && exObj) sentEl.innerHTML = exObj.en.replace(new RegExp(`(${w.word})`, "gi"), `<span style="color:var(--green);text-decoration:underline;">$1</span>`);
        speak(exObj ? exObj.en : w.word);
        msg.innerHTML = `🎉 Great job! "${w.word}"!`;
        setTimeout(() => {
          quizIndex = (quizIndex + 1) % words.length;
          render();
        }, 1200);
      } else {
        btn.classList.add("wrong");
        msg.innerHTML = `앗, 다시 한번 골라볼까요? 💪`;
      }
    }

    function renderHistory() {
      const byDate = {};
      for (const w of words) {
        const d = w.addedAt || "기타";
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(w);
      }
      const dates = Object.keys(byDate).sort().reverse();

      return `
        <div class="panel-card">
          <h3 style="margin:0 0 10px;font-size:16px;">📅 날짜별 누적 단어 기록</h3>
          ${dates.map(d => `
            <div class="timeline-row">
              <div>
                <strong>${d}</strong>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">
                  ${byDate[d].map(x => x.word).join(", ")}
                </div>
              </div>
              <span style="font-weight:900;color:var(--primary);">+${byDate[d].length}개</span>
            </div>
          `).join("")}
        </div>

        <div class="panel-card">
          <h3 style="margin:0 0 8px;font-size:16px;">📱 아이폰 홈 화면에 앱으로 추가하기</h3>
          <div style="font-size:13.5px;line-height:1.55;color:var(--muted);font-weight:600;">
            1. 이 파일을 <strong>Safari</strong>로 열기<br/>
            2. 하단 <strong>공유 버튼(□↑)</strong> 누르기<br/>
            3. <strong>'홈 화면에 추가'</strong> 선택하면 아이폰 앱처럼 바로 실행돼요!
          </div>
        </div>

        <div class="panel-card">
          <h3 style="margin:0 0 8px;font-size:16px;">💾 단어장 백업 · 관리</h3>
          <button class="btn-outline" onclick="exportBackup()">단어 데이터 백업 파일(JSON) 저장</button>
        </div>
      `;
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(words, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "chaewon-vocab-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function render() {
      document.getElementById("streakPill").textContent = `🔥 ${meta.days.length}일차`;
      const app = document.getElementById("app");
      if (activeNav === "home") app.innerHTML = renderHome();
      else if (activeNav === "words") {
        app.innerHTML = renderWords();
        const inp = document.getElementById("searchInput");
        if (inp) {
          inp.addEventListener("input", e => {
            searchQuery = e.target.value;
            render();
          });
        }
      }
      else if (activeNav === "quiz") app.innerHTML = renderQuiz();
      else if (activeNav === "history") app.innerHTML = renderHistory();
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchNav(btn.dataset.nav));
    });

    const modalBg = document.getElementById("modalBg");
    document.getElementById("openAddBtn").onclick = () => modalBg.classList.add("open");
    document.getElementById("closeModalBtn").onclick = () => modalBg.classList.remove("open");
    document.getElementById("saveWordBtn").onclick = () => {
      const word = document.getElementById("inWord").value.trim();
      const ko = document.getElementById("inKo").value.trim();
      if (!word || !ko) { alert("영어 단어와 영한 뜻을 입력해 주세요!"); return; }
      const en = document.getElementById("inEn").value.trim();
      const exEn = document.getElementById("inExEn").value.trim();
      const exKo = document.getElementById("inExKo").value.trim();
      const today = new Date().toISOString().slice(0, 10);
      words.unshift({
        id: word.toLowerCase().replace(/[^a-z0-9]/g, "") + "_" + Date.now(),
        word,
        phonetic: "",
        partOfSpeech: "내 단어",
        enMeaning: en,
        koMeaning: ko,
        examples: exEn ? [{ en: exEn, ko: exKo }] : [],
        image: "",
        addedAt: today,
        mastered: false
      });
      saveWords();
      modalBg.classList.remove("open");
      ["inWord","inEn","inKo","inExEn","inExKo"].forEach(id => document.getElementById(id).value = "");
      studyMode = false;
      wordsFilter = "all";
      switchNav("words");
    };

    render();
  </script>
</body>
</html>
